<div id="thermal-card" class="pcs-card-container thermal safe">
  <div class="pcs-header">
    <div class="pcs-title">
      <span class="pcs-icon">🌡️</span>
      <span id="thermal-title-text">PERFIL TÉRMICO INVERSORES</span>
    </div>
    <div id="thermal-badge" class="pcs-badge thermal safe">ÓPTIMO (&lt;65°C)</div>
  </div>

  <div class="pcs-main-metric">
    <span id="max-temp-val" class="main-num thermal safe">0.0</span>
    <span class="main-unit">°C TEMP MÁX</span>
  </div>

  <div class="thermal-grid">
    <!-- Módulo 1 -->
    <div class="thermal-row">
      <div class="t-info">
        <span id="t-lbl1" class="t-tag">PCS-1 (TQG136)</span>
        <span id="t-igbt1" class="t-value safe">0.0 °C</span>
      </div>
      <div id="t-amb1" class="t-amb">Amb: 0.0 °C</div>
    </div>
    <!-- Módulo 2 -->
    <div class="thermal-row">
      <div class="t-info">
        <span id="t-lbl2" class="t-tag">PCS-2 (TQG135)</span>
        <span id="t-igbt2" class="t-value safe">0.0 °C</span>
      </div>
      <div id="t-amb2" class="t-amb">Amb: 0.0 °C</div>
    </div>
    <!-- Módulo 3 -->
    <div class="thermal-row">
      <div class="t-info">
        <span id="t-lbl3" class="t-tag">PCS-3 (TQG134)</span>
        <span id="t-igbt3" class="t-value safe">0.0 °C</span>
      </div>
      <div id="t-amb3" class="t-amb">Amb: 0.0 °C</div>
    </div>
  </div>

  <div class="pcs-footer">
    <span id="thermal-footer-left">Climatización: <strong style="color:#64B856;">Activa</strong></span>
    <span id="thermal-footer-right">Gabinete: <strong>HVAC OK</strong></span>
  </div>
</div>
