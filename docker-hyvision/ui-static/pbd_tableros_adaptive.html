<div class="pbd-card-container">
  <div class="pbd-header">
    <div class="pbd-title">
      <span class="pbd-icon">☀️</span>
      <span id="pbd-title-text">TABLEROS DC / STRINGS MPPT</span>
    </div>
    <div id="pbd-status-badge" class="pbd-badge ok">BUS DC ACTIVO</div>
  </div>

  <div class="pbd-top-metrics">
    <div class="pbd-kpi-block">
      <span class="kpi-sub-lbl">TENSIÓN BUS DC</span>
      <div class="kpi-val-group">
        <span id="pbd-vbus-val" class="kpi-vbus">--</span>
        <span class="kpi-unit-pbd">V</span>
      </div>
    </div>
    <div class="pbd-sep"></div>
    <div class="pbd-kpi-block">
      <span class="kpi-sub-lbl">CORRIENTE SOLAR TOTAL</span>
      <div class="kpi-val-group">
        <span id="pbd-itot-val" class="kpi-itot">0.0</span>
        <span class="kpi-unit-pbd">A</span>
      </div>
    </div>
  </div>

  <div class="strings-matrix">
    <div class="str-col"><span class="s-tag">STR 1</span><span id="str1-val" class="s-val">0.0 A</span><div class="s-bar"><div id="str1-bar" class="s-fill" style="width:0%;"></div></div></div>
    <div class="str-col"><span class="s-tag">STR 2</span><span id="str2-val" class="s-val">0.0 A</span><div class="s-bar"><div id="str2-bar" class="s-fill" style="width:0%;"></div></div></div>
    <div class="str-col"><span class="s-tag">STR 3</span><span id="str3-val" class="s-val">0.0 A</span><div class="s-bar"><div id="str3-bar" class="s-fill" style="width:0%;"></div></div></div>
    <div class="str-col"><span class="s-tag">STR 4</span><span id="str4-val" class="s-val">0.0 A</span><div class="s-bar"><div id="str4-bar" class="s-fill" style="width:0%;"></div></div></div>
    <div class="str-col"><span class="s-tag">STR 5</span><span id="str5-val" class="s-val">0.0 A</span><div class="s-bar"><div id="str5-bar" class="s-fill" style="width:0%;"></div></div></div>
  </div>

  <div class="pbd-footer">
    <span>Disponibilidad DC: <strong id="pbd-secc-text" style="color:#64B856;">Conectado (Normal)</strong></span>
    <span id="pbd-footer-cap">Capacidad: <strong>Bus Telecom 48V</strong></span>
  </div>
</div>
