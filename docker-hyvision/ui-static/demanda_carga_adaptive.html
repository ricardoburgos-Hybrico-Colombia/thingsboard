<div class="load-card-container">
  <div class="load-card-header">
    <div class="load-title">
      <span class="load-icon">📡</span>
      <span>DEMANDA DE CARGA</span>
    </div>
    <div id="load-badge-status" class="load-live-badge">EN VIVO</div>
  </div>

  <div class="load-metric-body">
    <span id="load-power-value" class="metric-value">0.0</span>
    <span class="metric-unit">kW</span>
  </div>

  <div class="load-divider"></div>

  <div class="load-card-footer">
    <div class="footer-left">
      <div class="footer-label">Acumulado hoy:</div>
      <div id="load-subtext-arch" class="footer-subtext">Estación Base Telecom BTS</div>
    </div>
    <div class="footer-right">
      <div id="load-energy-value" class="footer-value">0.0 kWh</div>
    </div>
  </div>
</div>
