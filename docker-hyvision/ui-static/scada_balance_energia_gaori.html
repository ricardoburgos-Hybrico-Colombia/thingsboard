    <div class="kpi-col">
      <span class="kpi-lbl">⚡ ALMACENADA BESS</span>

  <div class="chart-wrapper">
    <div id="echarts-energy-balance" style="width: 100%; height: 100%;"></div>

  <div class="trend-footer">
    <span id="eb-axis-foot">Eje: <strong style="color:#F59E0B;">Solar</strong> · <strong style="color:#10B981;">Carga</strong> · <strong style="color:#A855F7;">BESS In</strong> · <strong style="color:#06B6D4;">BESS Out (kWh)</strong></span>
