<div class="dg-pwr-card">
  <div class="card-header-pwr">
    <div class="title-pwr">
      <span class="icon-pwr">📊</span>
      <span id="pwr-title-lbl">POTENCIA APARENTE Y REACTIVA (MG)</span>
    </div>
    <div id="pf-badge" class="badge-pwr">STANDBY</div>
  </div>

  <div class="pwr-split-body">
    <div class="pwr-block">
      <span class="pwr-sub">POTENCIA APARENTE (S)</span>
      <div class="pwr-main">
        <span id="kva-val" class="pwr-num kva">0.0</span>
        <span class="pwr-unit">kVA</span>
      </div>
      <span class="pwr-tag">Carga Alternador: <strong id="kva-pct-lbl">0%</strong></span>
    </div>

    <div class="pwr-sep"></div>

    <div class="pwr-block">
      <span class="pwr-sub">POTENCIA REACTIVA (Q)</span>
      <div class="pwr-main">
        <span id="kvar-val" class="pwr-num kvar">0.0</span>
        <span class="pwr-unit">kVAR</span>
      </div>
      <span class="pwr-tag">Régimen: <strong id="q-regime-lbl">Neutro</strong></span>
    </div>
  </div>

  <div class="pwr-bar-track">
    <div id="pwr-bar-fill" class="pwr-bar-fill" style="width: 0%;"></div>
  </div>

  <div class="card-footer-pwr">
    <span id="pwr-cap-foot">Límite Alternador: <strong>250 kVA</strong></span>
    <span id="kw-estimated-lbl">Pot. Activa: <strong style="color:#f1f5f9;">0.0 kW</strong></span>
  </div>
</div>
