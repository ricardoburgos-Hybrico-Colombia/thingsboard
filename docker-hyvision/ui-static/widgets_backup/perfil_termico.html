<div id="thermal-card" class="pcs-card-container thermal safe">
  <div class="pcs-header">
    <div class="pcs-title">
      <span class="pcs-icon">🌡️</span>
      <span>PERFIL TÉRMICO DE INVERSORES</span>
    </div>
    <div id="thermal-badge" class="pcs-badge thermal safe">ÓPTIMO (&lt;65°C)</div>
  </div>

  <div class="pcs-main-metric">
    <span id="max-temp-val" class="main-num thermal safe">49.1</span>
    <span class="main-unit">°C MÁX IGBT</span>
  </div>

  <div class="thermal-matrix">
    <!-- Col PCS 1 -->
    <div class="thermal-col">
      <div class="col-header">PCS-1</div>
      <div class="temp-row"><span class="t-label">IGBT:</span><span id="t-igbt1" class="t-value safe">48.5 °C</span></div>
      <div class="temp-row"><span class="t-label">Gabinete:</span><span id="t-amb1" class="t-value-amb">29.2 °C</span></div>
    </div>
    <!-- Col PCS 2 -->
    <div class="thermal-col">
      <div class="col-header">PCS-2</div>
      <div class="temp-row"><span class="t-label">IGBT:</span><span id="t-igbt2" class="t-value safe">47.8 °C</span></div>
      <div class="temp-row"><span class="t-label">Gabinete:</span><span id="t-amb2" class="t-value-amb">28.9 °C</span></div>
    </div>
    <!-- Col PCS 3 -->
    <div class="thermal-col">
      <div class="col-header">PCS-3</div>
      <div class="temp-row"><span class="t-label">IGBT:</span><span id="t-igbt3" class="t-value safe">49.1 °C</span></div>
      <div class="temp-row"><span class="t-label">Gabinete:</span><span id="t-amb3" class="t-value-amb">29.5 °C</span></div>
    </div>
  </div>

  <div class="pcs-footer">
    <span>Ventilación Forzada: <strong style="color:#64B856;">ACTIVA (Auto)</strong></span>
    <span>Disparo Térmico: <strong>85 °C</strong></span>
  </div>
</div>
