<div class="pcs-card-container reactive">
  <div class="pcs-header">
    <div class="pcs-title">
      <span class="pcs-icon">🔄</span>
      <span id="q-card-title">POTENCIA REACTIVA (VAR)</span>
    </div>
    <div id="q-regime-badge" class="pcs-badge reactive">RÉGIMEN DC PURO</div>
  </div>

  <div class="pcs-main-metric">
    <span id="q-total-val" class="main-num reactive">0.0</span>
    <span class="main-unit">kVAR TOTAL</span>
  </div>

  <div id="q-grid-tiles" class="reactive-grid">
    <div class="reactive-tile">
      <span id="q-tile1-title" class="tile-title">PCS-1 / F1</span>
      <span id="q-pcs1-val" class="tile-val">0.0 kVAR</span>
      <span class="tile-sub">cos φ: 1.00</span>
    </div>
    <div class="reactive-tile">
      <span id="q-tile2-title" class="tile-title">PCS-2 / F2</span>
      <span id="q-pcs2-val" class="tile-val">0.0 kVAR</span>
      <span class="tile-sub">cos φ: 1.00</span>
    </div>
    <div class="reactive-tile">
      <span id="q-tile3-title" class="tile-title">PCS-3 / F3</span>
      <span id="q-pcs3-val" class="tile-val">0.0 kVAR</span>
      <span class="tile-sub">cos φ: 1.00</span>
    </div>
  </div>

  <div class="pcs-footer">
    <span id="q-footer-left">Compensación: <strong id="q-comp-val" style="color:#64B856;">DC Equilibrado</strong></span>
    <span id="q-footer-right">Topología: <strong>Telecom 48V</strong></span>
  </div>
</div>
