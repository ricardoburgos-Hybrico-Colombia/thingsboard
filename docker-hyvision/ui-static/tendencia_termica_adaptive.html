<div id="therm-card" class="trend-card-container therm ok">
  <div class="trend-header">
    <div class="trend-title">
      <span class="trend-icon">🌡️</span>
      <span id="therm-title-text">DISPERSIÓN TÉRMICA BESS (ΔT)</span>
    </div>
    <div id="therm-trend-badge" class="trend-badge ok">ΔT CONTROLADO (HVAC)</div>
  </div>

  <div class="trend-kpi-bar">
    <div class="kpi-col">
      <span class="kpi-lbl">TÉRMICA PRINCIPAL</span>
      <div class="kpi-val-group">
        <span id="dt-live-val" class="kpi-num dt-color">0.0</span>
        <span id="dt-unit-text" class="kpi-unit">°C ΔT MÁX</span>
      </div>
      <span id="dt-sub-val" class="kpi-sub">En Vivo</span>
    </div>
    <div class="kpi-divider"></div>
    <div class="kpi-col">
      <span class="kpi-lbl">REFERENCIA MÁX</span>
      <div class="kpi-val-group">
        <span id="tmax-live-val" class="kpi-num tmax-color">0.0</span>
        <span class="kpi-unit">°C</span>
      </div>
      <span id="tmax-sub-val" class="kpi-sub">En Vivo</span>
    </div>
    <div class="kpi-divider"></div>
    <div class="kpi-col">
      <span class="kpi-lbl">REFERENCIA MÍN</span>
      <div class="kpi-val-group">
        <span id="tmin-live-val" class="kpi-num tmin-color">0.0</span>
        <span class="kpi-unit">°C</span>
      </div>
      <span id="tmin-sub-val" class="kpi-sub">En Vivo</span>
    </div>
  </div>

  <div class="chart-wrapper">
    <div id="echarts-trend-therm" style="width: 100%; height: 100%;"></div>
  </div>

  <div class="trend-footer">
    <span id="therm-limit-foot">Límite de Control: <strong style="color:#ef4444;">-- 12.0°C / 35.0°C</strong></span>
    <span id="therm-diag-text">Estado: <strong style="color:#64B856;">Climatizado / Seguro (T.Máx 28°C)</strong></span>
  </div>
</div>
